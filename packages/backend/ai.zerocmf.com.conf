server {
    listen 80;
    server_name ai.zerocmf.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name ai.zerocmf.com;

    ssl_certificate /etc/nginx/ssl/ai.zerocmf.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/ai.zerocmf.com/ai.zerocmf.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    auth_basic "AI Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:14800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
